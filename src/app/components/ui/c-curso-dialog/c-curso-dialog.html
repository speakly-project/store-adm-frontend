<c-curso-card [curso]="curso"></c-curso-card>
  <mat-dialog-actions>
    @if (data.accion!= 'ver'){
    <button c-boton [importancia]="importanciaBoton" (click)="seleccionarAccion(data.accion)">{{textoBoton}}</button>
    } @else {
    <button style="visibility: hidden;"></button>
    }
    <button c-boton mat-dialog-close>Cancelar</button>

  </mat-dialog-actions>
