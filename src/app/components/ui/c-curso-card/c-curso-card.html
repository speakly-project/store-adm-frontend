<div class="c-curso-card">
  <div class="c-curso-card__header">
    <h2 class="c-curso-card__title">{{ curso.title }}</h2>
    <h3 class="c-curso-card__id">ID: {{ curso.id }}</h3>
  </div>

  <div class="c-curso-card__content">
    <div class="c-curso-card__details">
      <p class="c-curso-card__detail">
        <span class="c-curso-card__label">Descripción:</span> {{ curso.description }}
      </p>
      <p class="c-curso-card__detail">
        <span class="c-curso-card__label">Precio:</span> {{ curso.price }}€
      </p>
      <p class="c-curso-card__detail">
        <span class="c-curso-card__label">Idioma:</span> {{ curso.language }}
      </p>
      <p class="c-curso-card__detail">
        <span class="c-curso-card__label">Nivel:</span> {{ curso.level }}
      </p>
      <p class="c-curso-card__detail">
        <span class="c-curso-card__label">Duración:</span> {{ curso.duration }} horas
      </p>
      <p class="c-curso-card__detail">
        <span class="c-curso-card__label">Creado el:</span> {{ curso.createdAt | date:'short' }}
      </p>
      <p class="c-curso-card__detail">
        <span class="c-curso-card__label">Creado por usuario:</span> {{ usuarioNombre }}
      </p>
    </div>

    <div class="c-curso-card__image-wrapper">
      <img class="c-curso-card__image"
           [src]="'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTLPK9PCyWnpPHFqAyv4i2vGIq2gR5w2A5yuA&s'"
           [alt]="curso.title">
    </div>
  </div>
</div>
